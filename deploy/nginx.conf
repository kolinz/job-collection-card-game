# Nginx リバースプロキシ設定 — career-collection-game
#
# 配置先: /etc/nginx/sites-available/career-collection-game
# 有効化: ln -s /etc/nginx/sites-available/career-collection-game \
#                /etc/nginx/sites-enabled/career-collection-game
#
# SSL 化: certbot --nginx -d <your-domain>
#         （Let's Encrypt を使う場合。IBM Cloud VPC の Security Group で
#           ポート 80 / 443 を開けておくこと）

server {
    listen 80;
    server_name _;          # ドメイン名が決まったら置き換える

    # WebSocket のアップグレードに必要なヘッダー
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 実際のクライアント IP を転送
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # タイムアウト（WebSocket の長時間接続に対応）
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>職種コレクションゲーム</title>
  <style>
    /* ===== リセット・ベース ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    button {
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
    }
    input, select { font-family: inherit; }

    /* ===== プレイヤーカラー CSS変数 ===== */
    .pc-1 { --pc: #6366f1; } .pc-2 { --pc: #f59e0b; }
    .pc-3 { --pc: #10b981; } .pc-4 { --pc: #ef4444; }
    .pc-5 { --pc: #38bdf8; } .pc-6 { --pc: #a855f7; }

    /* ===== CSSアニメーション（必須3種） ===== */
    @keyframes su {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fo {
      to { opacity: 0; transform: scale(0.94); }
    }
    @keyframes pip {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.5); }
      100% { transform: scale(1); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideDown { from { transform: translateY(-20px); opacity:0; } to { transform: translateY(0); opacity:1; } }

    /* ===== ページ共通カード ===== */
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
    }

    /* ===== ルーム作成・参加画面 ===== */
    #app { min-height: 100vh; }
    .room-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .room-screen h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    .room-screen h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #94a3b8;
    }
    .room-screen .card { width: 100%; max-width: 480px; }
    .form-row { margin-bottom: 16px; }
    .form-row label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    .form-row input[type="text"],
    .form-row input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 1rem;
    }
    .form-row input:focus { outline: none; border-color: #6366f1; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-count {
      padding: 8px 20px;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #0f172a;
      color: #94a3b8;
      font-size: 1rem;
      transition: all .15s;
    }
    .btn-count.selected, .btn-count:hover { border-color: #6366f1; color: #6366f1; }

    .color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
    .color-dot {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    .color-dot:hover { transform: scale(1.15); }
    .color-dot.selected { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.3); }
    .color-dot.taken { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      margin-top: 8px;
      transition: background .15s;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    /* ===== ロビー画面 ===== */
    .invite-url-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .invite-url-box input {
      flex: 1;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .btn-copy {
      padding: 10px 16px;
      background: #334155;
      color: #e2e8f0;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: background .15s;
    }
    .btn-copy:hover { background: #475569; }

    .player-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .player-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .player-item .dot {
      width: 12px; height: 12px; border-radius: 50%;
    }
    .player-item.waiting { color: #475569; font-style: italic; }

    /* ===== ゲーム画面 ===== */
    .game-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* スコアバー */
    #sb {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .sb-player {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 2px solid transparent;
      white-space: nowrap;
    }
    .sb-player.active-turn { border-color: var(--pc, #6366f1); }
    .sb-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pc, #6366f1); }
    .sb-name { font-size: 0.9rem; font-weight: 600; }
    .sb-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0f172a;
      color: #94a3b8;
    }
    .sb-badge.cat { background: #1c1400; color: #fbbf24; border: 1px solid #92400e; }

    /* ターン情報バー */
    #turn-bar {
      padding: 6px 16px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #94a3b8;
      flex-shrink: 0;
    }

    /* メインゲームエリア */
    .game-main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ターン操作エリア */
    #turn-action {
      width: 280px;
      min-width: 220px;
      padding: 16px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    /* サイコロ表示 */
    #dice-display {
      font-size: 3rem;
      text-align: center;
      padding: 12px;
      animation: pip .4s ease;
    }
    .btn-roll {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      transition: background .15s;
    }
    .btn-roll:hover { background: #4338ca; }
    .btn-roll:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    .btn-next-turn {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: background .15s;
    }
    .btn-next-turn:hover { background: #1e293b; }
    .btn-next-turn:disabled { color: #475569; cursor: not-allowed; }

    /* 候補カード */
    #candidates-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .candidates-label {
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
    }

    .candidate-card {
      padding: 10px 12px;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
      animation: su .3s ease forwards;
    }
    .candidate-card:hover:not(.owned):not(.selected) { border-color: #6366f1; }
    .candidate-card.selected {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.25);
      background: #1e1b4b;
    }
    .candidate-card.owned {
      opacity: 0.4;
      cursor: not-allowed;
      border-style: dashed;
    }
    .candidate-card .c-name { font-size: 0.9rem; font-weight: 600; }
    .candidate-card .c-type {
      font-size: 0.72rem;
      margin-top: 3px;
      padding: 1px 6px;
      border-radius: 4px;
      display: inline-block;
    }
    .c-type.skill   { background: #1e3a8a; color: #93c5fd; }
    .c-type.mission { background: #3b0764; color: #d8b4fe; }

    .btn-confirm {
      width: 100%;
      padding: 8px;
      background: #22c55e;
      color: #fff;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background .15s;
    }
    .btn-confirm:hover { background: #16a34a; }

    /* プレイヤーボード */
    #boards-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: grid;
      gap: 12px;
      align-content: start;
    }
    /* 2人: 1列, 3人: 3列, 4人: 2列2段 */
    #boards-area.players-2 { grid-template-columns: 1fr 1fr; }
    #boards-area.players-3 { grid-template-columns: 1fr 1fr 1fr; }
    #boards-area.players-4 { grid-template-columns: 1fr 1fr; }

    .player-board {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 12px;
    }
    .player-board.my-board { border-color: #6366f1; }
    .player-board.left-board { opacity: 0.45; }
    .board-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .board-header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pc, #6366f1); }
    .board-name { font-weight: 600; font-size: 0.95rem; }
    .left-badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      background: #334155;
      border-radius: 4px;
      color: #94a3b8;
    }

    .board-section { margin-bottom: 8px; }
    .board-section-label {
      font-size: 0.72rem;
      color: #64748b;
      margin-bottom: 4px;
    }
    .chip-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .card-chip {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
      font-family: inherit;
    }
    button.chip-clickable {
      cursor: pointer;
      transition: opacity .15s;
    }
    button.chip-clickable:hover { opacity: 0.75; }
    .card-chip.skill   { background: #1e3a8a; color: #93c5fd; }
    .card-chip.mission { background: #3b0764; color: #d8b4fe; }
    .card-chip.category-achieved {
      background: #1c1400;
      color: #fbbf24;
      border: 1px solid #92400e;
      box-shadow: inset 0 0 0 1px #fbbf24;
    }
    .card-chip.grey { background: #1e293b; color: #475569; border: 1px solid #334155; }

    .btn-dex {
      width: 100%;
      padding: 6px;
      font-size: 0.8rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #94a3b8;
      margin-top: 8px;
      transition: background .15s;
    }
    .btn-dex:hover { background: #1e293b; color: #e2e8f0; }

    /* ===== 職種図鑑モーダル ===== */
    #category-dex-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #category-dex-overlay.open { display: flex; animation: fadeIn .2s; }
    #category-dex-modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 90%;
      max-width: 640px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .dex-header {
      padding: 16px 20px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dex-header h3 { font-size: 1rem; font-weight: 600; }
    .btn-close {
      padding: 4px 10px;
      background: #334155;
      border-radius: 6px;
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .dex-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .dex-card {
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    .dex-card.achieved { border-color: #92400e; }
    .dex-card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .dex-achieved-badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      background: #1c1400;
      color: #fbbf24;
      border: 1px solid #92400e;
      border-radius: 4px;
    }
    .dex-section { margin-bottom: 6px; }
    .dex-section-label {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
    }
    /* 職種説明マークダウン */
    .dex-desc {
      font-size: 0.82rem;
      color: #94a3b8;
      line-height: 1.65;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .dex-desc .md-h2 { font-size: 0.92rem; font-weight: 700; color: #e2e8f0; margin: 0 0 4px; }
    .dex-desc .md-h3 { font-size: 0.82rem; font-weight: 600; color: #cbd5e1; margin: 8px 0 4px; }
    .dex-desc .md-p  { margin: 0 0 4px; }
    .dex-desc .md-ul { margin: 0 0 4px 16px; padding: 0; }
    .dex-desc .md-ul li { list-style: disc; margin-bottom: 2px; }

    /* ===== チャット サイドパネル ===== */
    #chat-toggle {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 50;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #6366f1;
      color: #fff;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
      transition: background .15s;
    }
    #chat-toggle:hover { background: #4f46e5; }
    #chat-badge {
      position: absolute;
      top: -3px; right: -3px;
      width: 16px; height: 16px;
      background: #ef4444;
      border-radius: 50%;
      font-size: 0.65rem;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #chat-badge.show { display: flex; }

    #chat-panel {
      position: fixed;
      right: 0; bottom: 0;
      width: 320px;
      height: 440px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px 0 0 0;
      z-index: 49;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .25s;
    }
    #chat-panel.open { transform: translateX(0); }
    .chat-header {
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      font-weight: 600;
      font-size: 0.9rem;
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-msg { font-size: 0.85rem; }
    .chat-msg .msg-name { font-weight: 600; margin-right: 4px; }
    .chat-msg .msg-text { color: #cbd5e1; }
    .chat-footer {
      padding: 10px 12px;
      border-top: 1px solid #334155;
      display: flex;
      gap: 6px;
    }
    #chat-input {
      flex: 1;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.85rem;
    }
    #chat-input:focus { outline: none; border-color: #6366f1; }
    .btn-chat-send {
      padding: 8px 12px;
      background: #6366f1;
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .btn-chat-send:hover { background: #4f46e5; }

    /* ===== トースト通知 ===== */
    #toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      padding: 10px 20px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #e2e8f0;
      animation: slideDown .25s ease;
    }
    .toast.error { background: #450a0a; border-color: #991b1b; color: #fca5a5; }
    .toast.success { background: #052e16; border-color: #166534; color: #86efac; }

    /* ===== ゲーム終了・ランキング ===== */
    .ranking-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .ranking-screen h1 { font-size: 2rem; margin-bottom: 24px; }
    .ranking-list { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 8px; }
    .ranking-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    .rank-num { font-size: 1.5rem; font-weight: 700; width: 40px; text-align: center; }
    .rank-num.rank-1 { color: #fbbf24; }
    .rank-name { font-weight: 600; flex: 1; }
    .rank-score { color: #94a3b8; font-size: 0.9rem; }

    /* ===== スクロールバー ===== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    /* ===== カード説明モーダル ===== */
    #card-desc-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 150;
      align-items: center;
      justify-content: center;
    }
    #card-desc-overlay.open { display: flex; animation: fadeIn .15s; }
    #card-desc-modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      padding: 24px;
      position: relative;
    }
    #card-desc-modal .cdm-type {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 10px;
    }
    #card-desc-modal .cdm-name {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f1f5f9;
    }
    #card-desc-modal .cdm-category {
      font-size: 0.78rem;
      color: #64748b;
      margin-left: 8px;
      vertical-align: middle;
    }
    #card-desc-modal .cdm-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.7;
    }
    #card-desc-modal .cdm-close {
      position: absolute;
      top: 14px; right: 14px;
      padding: 4px 10px;
      background: #334155;
      border-radius: 6px;
      color: #94a3b8;
      font-size: 0.82rem;
    }
    #card-desc-modal .cdm-close:hover { background: #475569; color: #e2e8f0; }
    .btn-card-desc {
      font-size: 0.72rem;
      color: #64748b;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      margin-top: 4px;
      display: block;
    }
    .btn-card-desc:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- トースト通知コンテナ -->
  <div id="toast-container"></div>

  <!-- チャット開閉ボタン（ゲーム画面に入ると追加される） -->

  <!-- 職種図鑑モーダル -->
  <div id="category-dex-overlay">
    <div id="category-dex-modal">
      <div class="dex-header">
        <h3 id="dex-title">職種図鑑</h3>
        <button class="btn-close" id="dex-close-btn">閉じる</button>
      </div>
      <div class="dex-body" id="dex-body"></div>
    </div>
  </div>

  <!-- カード説明モーダル -->
  <div id="card-desc-overlay">
    <div id="card-desc-modal">
      <button class="cdm-close" id="cdm-close-btn">閉じる</button>
      <span class="cdm-type" id="cdm-type"></span><span class="cdm-category" id="cdm-category"></span>
      <div class="cdm-name" id="cdm-name"></div>
      <div class="cdm-desc" id="cdm-desc"></div>
    </div>
  </div>

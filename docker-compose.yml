# ---------------------------------------------------------------------------
# docker-compose.yml — career-collection-game v2.0-B
#
# 使い方:
#   1. cp env.example .env && vi .env   # 環境変数を編集
#   2. docker compose up -d             # バックグラウンド起動
#   3. docker compose logs -f           # ログ確認
#   4. docker compose down              # 停止
#
# game.db は Docker Volume "db-data" に永続化される。
# DB を完全リセットする場合: docker compose down -v && docker compose up -d
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: career-collection-game:latest
    container_name: career-collection-game
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # game.db をボリューム内に配置する
      DB_PATH: /data/game.db
      # コンテナ内では PORT を固定
      PORT: "3000"
    volumes:
      # SQLite DB の永続化
      - db-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  db-data:
    driver: local
